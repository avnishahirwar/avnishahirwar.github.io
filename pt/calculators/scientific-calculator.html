<meta name="twitter:image" content="https://friendlycalculator.in/og-friendly-calculator.png"></head><body><main class="wrap"><p><a href="/pt/index.html">Início</a> / Calculadoras</p><h1>Calculadora científica</h1><p>Calcule seno, cosseno, tangente, raízes, logaritmos e potências.</p><section class="panel"><form id="f"><div class="fields"><label>Valor<input id="x" type="number" step="any" value="45"></label><label>Função<select id="op"><option value="sin">Seno</option><option value="cos">Cosseno</option><option value="tan">Tangente</option><option value="sqrt">Raiz quadrada</option><option value="ln">Logaritmo natural</option><option value="log">Logaritmo base 10</option><option value="square">Quadrado</option><option value="cube">Cubo</option><option value="abs">Valor absoluto</option></select></label><label>Ângulo<select id="angle"><option value="deg">Graus</option><option value="rad">Radianos</option></select></label></div><p><button class="btn">Calcular</button></p></form><p>Resultado: <strong class="result" id="out">—</strong></p><p id="status">Os resultados são cálculos matemáticos. Confira os valores e unidades.</p></section><section class="panel"><h2>Calculadoras</h2><p>Os resultados são cálculos matemáticos. Confira os valores e unidades.</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("pt",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="Valores inválidos ou operação indefinida."}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("x").value,o=document.getElementById("op").value,rad=document.getElementById("angle").value==="deg"?x*Math.PI/180:x;if(!Number.isFinite(x)){bad();return;}let v;if(o==="sin")v=Math.sin(rad);else if(o==="cos")v=Math.cos(rad);else if(o==="tan"){if(Math.abs(Math.cos(rad))<1e-12){bad();return;}v=Math.tan(rad);}else if(o==="sqrt"){if(x<0){bad();return;}v=Math.sqrt(x);}else if(o==="ln"||o==="log"){if(x<=0){bad();return;}v=o==="ln"?Math.log(x):Math.log10(x);}else if(o==="square")v=x*x;else if(o==="cube")v=x*x*x;else v=Math.abs(x);if(!Number.isFinite(v)){bad();return;}out=[v];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="Os resultados são cálculos matemáticos. Confira os valores e unidades.";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
