<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora básica | Friendly Calculator</title><meta name="description" content="Realize as quatro operações aritméticas básicas."><link rel="canonical" href="https://friendlycalculator.in/pt/calculators/basic-calculator.html"><link rel="alternate" hreflang="en" href="https://friendlycalculator.in/calculators/basic-calculator.html"><link rel="alternate" hreflang="hi" href="https://friendlycalculator.in/hi/calculators/basic-calculator.html"><link rel="alternate" hreflang="es" href="https://friendlycalculator.in/es/calculators/basic-calculator.html"><link rel="alternate" hreflang="fr" href="https://friendlycalculator.in/fr/calculators/basic-calculator.html"><link rel="alternate" hreflang="pt" href="https://friendlycalculator.in/pt/calculators/basic-calculator.html"><link rel="alternate" hreflang="ar" href="https://friendlycalculator.in/ar/calculators/basic-calculator.html"><link rel="alternate" hreflang="id" href="https://friendlycalculator.in/id/calculators/basic-calculator.html"><link rel="alternate" hreflang="bn" href="https://friendlycalculator.in/bn/calculators/basic-calculator.html"><link rel="alternate" hreflang="ta" href="https://friendlycalculator.in/ta/calculators/basic-calculator.html"><link rel="alternate" hreflang="x-default" href="https://friendlycalculator.in/calculators/basic-calculator.html"><meta name="robots" content="index,follow"><meta property="og:title" content="Calculadora básica"><meta property="og:description" content="Realize as quatro operações aritméticas básicas."><meta property="og:url" content="https://friendlycalculator.in/pt/calculators/basic-calculator.html"><meta property="og:image" content="https://friendlycalculator.in/og-friendly-calculator.png"><link rel="stylesheet" href="/assets/site-shell.css"><style>body{margin:0;background:#f5f6f8;color:#172638;font:16px/1.7 system-ui,sans-serif}.wrap{width:min(900px,92%);margin:24px auto}.panel{background:#fff;border:1px solid #dfe5eb;border-radius:14px;padding:22px;margin:16px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.fields label{display:grid;gap:6px}.fields input,.fields select{padding:11px;border:1px solid #b8c4cf;border-radius:8px;font:inherit}.btn{background:#101c2c;color:#fff;padding:12px 18px;border:0;border-radius:8px}.result{background:#edf3f7;padding:14px;border-radius:9px;font-weight:700}@media(max-width:650px){.fields{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p><a href="/pt/index.html">Início</a> / Calculadoras</p><h1>Calculadora básica</h1><p>Realize as quatro operações aritméticas básicas.</p><section class="panel"><form id="f"><div class="fields"><label>Primeiro número<input id="a" type="number" step="any" value="12"></label><label>Operação<select id="op"><option value="add">Somar</option><option value="sub">Subtrair</option><option value="mul">Multiplicar</option><option value="div">Dividir</option></select></label><label>Segundo número<input id="b" type="number" step="any" value="3"></label></div><p><button class="btn">Calcular</button></p></form><p>Resultado: <strong class="result" id="out">—</strong></p><p id="status">Os resultados são cálculos matemáticos. Confira os valores e unidades.</p></section><section class="panel"><h2>Calculadoras</h2><p>Os resultados são cálculos matemáticos. Confira os valores e unidades.</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("pt",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="Valores inválidos ou operação indefinida."}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("a").value,y=+document.getElementById("b").value,o=document.getElementById("op").value;if(!Number.isFinite(x)||!Number.isFinite(y)||(o==="div"&&y===0)){bad();return;}out=[o==="add"?x+y:o==="sub"?x-y:o==="mul"?x*y:x/y];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="Os resultados são cálculos matemáticos. Confira os valores e unidades.";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
