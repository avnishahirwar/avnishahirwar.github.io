<meta name="twitter:image" content="https://friendlycalculator.in/og-friendly-calculator.png"></head><body><main class="wrap"><p><a href="/ar/index.html">الرئيسية</a> / الحاسبات</p><h1>حاسبة علمية</h1><p>احسب الجيب وجيب التمام والظل والجذور واللوغاريتمات والقوى.</p><section class="panel"><form id="f"><div class="fields"><label>القيمة<input id="x" type="number" step="any" value="45"></label><label>الدالة<select id="op"><option value="sin">جيب</option><option value="cos">جيب التمام</option><option value="tan">ظل</option><option value="sqrt">الجذر التربيعي</option><option value="ln">اللوغاريتم الطبيعي</option><option value="log">لوغاريتم أساس 10</option><option value="square">تربيع</option><option value="cube">تكعيب</option><option value="abs">القيمة المطلقة</option></select></label><label>الزاوية<select id="angle"><option value="deg">درجات</option><option value="rad">راديان</option></select></label></div><p><button class="btn">احسب</button></p></form><p>النتيجة: <strong class="result" id="out">—</strong></p><p id="status">النتائج عمليات رياضية. تحقق من القيم والوحدات المدخلة.</p></section><section class="panel"><h2>الحاسبات</h2><p>النتائج عمليات رياضية. تحقق من القيم والوحدات المدخلة.</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("ar",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="قيم غير صحيحة أو عملية غير معرفة."}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("x").value,o=document.getElementById("op").value,rad=document.getElementById("angle").value==="deg"?x*Math.PI/180:x;if(!Number.isFinite(x)){bad();return;}let v;if(o==="sin")v=Math.sin(rad);else if(o==="cos")v=Math.cos(rad);else if(o==="tan"){if(Math.abs(Math.cos(rad))<1e-12){bad();return;}v=Math.tan(rad);}else if(o==="sqrt"){if(x<0){bad();return;}v=Math.sqrt(x);}else if(o==="ln"||o==="log"){if(x<=0){bad();return;}v=o==="ln"?Math.log(x):Math.log10(x);}else if(o==="square")v=x*x;else if(o==="cube")v=x*x*x;else v=Math.abs(x);if(!Number.isFinite(v)){bad();return;}out=[v];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="النتائج عمليات رياضية. تحقق من القيم والوحدات المدخلة.";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
