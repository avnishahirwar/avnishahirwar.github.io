<meta name="twitter:image" content="https://friendlycalculator.in/og-friendly-calculator.png"></head><body><main class="wrap"><p><a href="/id/index.html">Beranda</a> / Kalkulator</p><h1>Kalkulator dasar</h1><p>Lakukan empat operasi aritmetika dasar.</p><section class="panel"><form id="f"><div class="fields"><label>Angka pertama<input id="a" type="number" step="any" value="12"></label><label>Operasi<select id="op"><option value="add">Tambah</option><option value="sub">Kurang</option><option value="mul">Kali</option><option value="div">Bagi</option></select></label><label>Angka kedua<input id="b" type="number" step="any" value="3"></label></div><p><button class="btn">Hitung</button></p></form><p>Hasil: <strong class="result" id="out">—</strong></p><p id="status">Hasil merupakan perhitungan matematika. Periksa nilai dan satuan masukan.</p></section><section class="panel"><h2>Kalkulator</h2><p>Hasil merupakan perhitungan matematika. Periksa nilai dan satuan masukan.</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("id",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="Nilai tidak valid atau operasi tidak terdefinisi."}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("a").value,y=+document.getElementById("b").value,o=document.getElementById("op").value;if(!Number.isFinite(x)||!Number.isFinite(y)||(o==="div"&&y===0)){bad();return;}out=[o==="add"?x+y:o==="sub"?x-y:o==="mul"?x*y:x/y];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="Hasil merupakan perhitungan matematika. Periksa nilai dan satuan masukan.";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
