</head><body><main class="wrap"><p><a href="/bn/index.html">হোম</a> / ক্যালকুলেটর</p><h1>বৈজ্ঞানিক ক্যালকুলেটর</h1><p>সাইন, কোসাইন, ট্যানজেন্ট, বর্গমূল, লগারিদম ও ঘাত হিসাব করুন।</p><section class="panel"><form id="f"><div class="fields"><label>মান<input id="x" type="number" step="any" value="45"></label><label>ফাংশন<select id="op"><option value="sin">সাইন</option><option value="cos">কোসাইন</option><option value="tan">ট্যানজেন্ট</option><option value="sqrt">বর্গমূল</option><option value="ln">ন্যাচারাল লগ</option><option value="log">লগ বেস ১০</option><option value="square">বর্গ</option><option value="cube">ঘন</option><option value="abs">পরম মান</option></select></label><label>কোণ<select id="angle"><option value="deg">ডিগ্রি</option><option value="rad">রেডিয়ান</option></select></label></div><p><button class="btn">হিসাব করুন</button></p></form><p>ফলাফল: <strong class="result" id="out">—</strong></p><p id="status">ফলাফল গাণিতিক হিসাব। ইনপুট মান ও একক যাচাই করুন।</p></section><section class="panel"><h2>ক্যালকুলেটর</h2><p>ফলাফল গাণিতিক হিসাব। ইনপুট মান ও একক যাচাই করুন।</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("bn-BD",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="অবৈধ মান বা অনির্ধারিত অপারেশন।"}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("x").value,o=document.getElementById("op").value,rad=document.getElementById("angle").value==="deg"?x*Math.PI/180:x;if(!Number.isFinite(x)){bad();return;}let v;if(o==="sin")v=Math.sin(rad);else if(o==="cos")v=Math.cos(rad);else if(o==="tan"){if(Math.abs(Math.cos(rad))<1e-12){bad();return;}v=Math.tan(rad);}else if(o==="sqrt"){if(x<0){bad();return;}v=Math.sqrt(x);}else if(o==="ln"||o==="log"){if(x<=0){bad();return;}v=o==="ln"?Math.log(x):Math.log10(x);}else if(o==="square")v=x*x;else if(o==="cube")v=x*x*x;else v=Math.abs(x);if(!Number.isFinite(v)){bad();return;}out=[v];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="ফলাফল গাণিতিক হিসাব। ইনপুট মান ও একক যাচাই করুন।";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
