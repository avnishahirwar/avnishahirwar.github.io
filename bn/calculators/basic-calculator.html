</head><body><main class="wrap"><p><a href="/bn/index.html">হোম</a> / ক্যালকুলেটর</p><h1>সাধারণ ক্যালকুলেটর</h1><p>চারটি মৌলিক গাণিতিক কাজ করুন।</p><section class="panel"><form id="f"><div class="fields"><label>প্রথম সংখ্যা<input id="a" type="number" step="any" value="12"></label><label>অপারেশন<select id="op"><option value="add">যোগ</option><option value="sub">বিয়োগ</option><option value="mul">গুণ</option><option value="div">ভাগ</option></select></label><label>দ্বিতীয় সংখ্যা<input id="b" type="number" step="any" value="3"></label></div><p><button class="btn">হিসাব করুন</button></p></form><p>ফলাফল: <strong class="result" id="out">—</strong></p><p id="status">ফলাফল গাণিতিক হিসাব। ইনপুট মান ও একক যাচাই করুন।</p></section><section class="panel"><h2>ক্যালকুলেটর</h2><p>ফলাফল গাণিতিক হিসাব। ইনপুট মান ও একক যাচাই করুন।</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("bn-BD",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="অবৈধ মান বা অনির্ধারিত অপারেশন।"}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("a").value,y=+document.getElementById("b").value,o=document.getElementById("op").value;if(!Number.isFinite(x)||!Number.isFinite(y)||(o==="div"&&y===0)){bad();return;}out=[o==="add"?x+y:o==="sub"?x-y:o==="mul"?x*y:x/y];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="ফলাফল গাণিতিক হিসাব। ইনপুট মান ও একক যাচাই করুন।";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
