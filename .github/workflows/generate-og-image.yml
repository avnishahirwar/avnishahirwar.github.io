name: Generate social sharing PNG

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-og-image.yml"
      - "og-friendly-calculator.svg"
      - "assets/og-friendly-calculator.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render 1200x630 PNG assets
        run: |
          mkdir -p /tmp/og-render
          cd /tmp/og-render
          npm init -y
          npm install sharp
          node - <<'NODE'
          const sharp = require('sharp');
          const path = require('path');
          const root = process.env.GITHUB_WORKSPACE;
          (async () => {
            for (const [source, target] of [
              ['og-friendly-calculator.svg', 'og-friendly-calculator.png'],
              ['assets/og-friendly-calculator.svg', 'assets/og-friendly-calculator.png']
            ]) {
              await sharp(path.join(root, source))
                .resize(1200, 630, { fit: 'cover' })
                .png({ compressionLevel: 9 })
                .toFile(path.join(root, target));
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Update social metadata to PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.html'):
              if any(part.startswith('.') for part in path.parts):
                  continue
              original = path.read_text(encoding='utf-8')
              if 'og:image' not in original:
                  continue
              updated = []
              for line in original.splitlines():
                  if '<meta property="og:image"' in line or '<meta name="twitter:image"' in line:
                      line = line.replace('.svg"', '.png"')
                  if 'property="og:image:type"' in line:
                      line = line.replace('image/svg+xml', 'image/png')
                  updated.append(line)
              text = '\n'.join(updated)
              if 'og:image:width' not in text:
                  text = text.replace('</head>', '<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"></head>')
              if 'twitter:image' not in text:
                  for line in updated:
                      if '<meta property="og:image"' in line:
                          url = line.split('content="', 1)[1].split('"', 1)[0]
                          text = text.replace('</head>', f'<meta name="twitter:image" content="{url}"></head>')
                          break
              path.write_text(text + '\n', encoding='utf-8')
          PY

      - name: Commit generated PNG and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-friendly-calculator.png assets/og-friendly-calculator.png
          git add '*.html' '**/*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Add PNG social preview images and update metadata"
            git push origin main
          fi
