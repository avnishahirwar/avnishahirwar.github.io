name: Cross-browser compatibility smoke tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cross-browser.yml"
      - "tests/cross-browser-smoke.cjs"\n      - "tests/safari-smoke.cjs"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "assets/site-chrome.js"
      - "assets/site-chrome.css"
      - "index.html"
      - "calculators/simple-interest-calculator.html"
  pull_request:
    paths:
      - ".github/workflows/cross-browser.yml"
      - "tests/cross-browser-smoke.cjs"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "assets/site-chrome.js"
      - "assets/site-chrome.css"
      - "index.html"
      - "calculators/simple-interest-calculator.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-matrix:
    name: "${{ matrix.browser }} desktop and mobile smoke tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, msedge, firefox, webkit, opera]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          case "${{ matrix.browser }}" in
            chrome)
              npx playwright install --with-deps chromium
              npx playwright install chrome
              ;;
            msedge)
              npx playwright install --with-deps chromium
              npx playwright install msedge
              ;;
            opera)
              npx playwright install --with-deps chromium
              curl -fsSL https://deb.opera.com/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/opera-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/opera-archive-keyring.gpg] https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera-stable.list
              sudo apt-get update
              sudo apt-get install -y opera-stable
              echo "FC_OPERA_PATH=$(command -v opera)" >> "$GITHUB_ENV"
              ;;
            *)
              npx playwright install --with-deps "${{ matrix.browser }}"
              ;;
          esac
      - name: Run cross-browser smoke tests against production
        env:
          FC_SITE_ORIGIN: https://friendlycalculator.in
          FC_BROWSER: ${{ matrix.browser }}
        run: node tests/cross-browser-smoke.cjs\n  safari-native:\n    name: Native Safari desktop/mobile smoke tests\n    runs-on: macos-latest\n    timeout-minutes: 20\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Set up Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - name: Install Selenium WebDriver\n        run: npm install --no-save selenium-webdriver\n      - name: Enable Safari WebDriver\n        run: sudo safaridriver --enable\n      - name: Run native Safari smoke tests against production\n        env:\n          FC_SITE_ORIGIN: https://friendlycalculator.in\n        run: node tests/safari-smoke.cjs\n