name: Cross-browser compatibility smoke tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cross-browser.yml"
      - "tests/cross-browser-smoke.cjs"
      - "tests/safari-smoke.cjs"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "assets/site-chrome.js"
      - "assets/site-chrome.css"
      - "index.html"
      - "calculators/simple-interest-calculator.html"
  pull_request:
    paths:
      - ".github/workflows/cross-browser.yml"
      - "tests/cross-browser-smoke.cjs"
      - "tests/safari-smoke.cjs"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "assets/site-chrome.js"
      - "assets/site-chrome.css"
      - "index.html"
      - "calculators/simple-interest-calculator.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-matrix:
    name: "${{ matrix.browser }} desktop and mobile smoke tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, msedge, firefox, webkit, opera]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          case "${{ matrix.browser }}" in
            chrome)
              npx playwright install --with-deps chromium
              npx playwright install chrome
              ;;
            msedge)
              npx playwright install --with-deps chromium
              npx playwright install msedge
              ;;
            opera)
              npx playwright install --with-deps chromium
              curl -fsSL https://deb.opera.com/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/opera-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/opera-archive-keyring.gpg] https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera-stable.list
              sudo apt-get update
              sudo apt-get install -y opera-stable gsettings-desktop-schemas dbus-x11
              echo "FC_OPERA_PATH=$(command -v opera)" >> "$GITHUB_ENV"
              ;;
            *)
              npx playwright install --with-deps "${{ matrix.browser }}"
              ;;
          esac
      - name: Wait for pull request deploy preview
        if: github.event_name == 'pull_request'
        env:
          FC_SITE_ORIGIN: https://deploy-preview-${{ github.event.pull_request.number }}--avnishahirwar.netlify.app
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$FC_SITE_ORIGIN/" >/dev/null; then
              echo "PR preview is ready: $FC_SITE_ORIGIN"
              exit 0
            fi
            sleep 10
          done
          echo "PR preview did not become ready within five minutes: $FC_SITE_ORIGIN"
          exit 1
      - name: Run cross-browser smoke tests against PR preview or production
        env:
          FC_SITE_ORIGIN: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--avnishahirwar.netlify.app', github.event.pull_request.number) || 'https://friendlycalculator.in' }}
          FC_BROWSER: ${{ matrix.browser }}
        run: node tests/cross-browser-smoke.cjs
  safari-native:
    name: Native Safari desktop/mobile smoke tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Selenium WebDriver
        run: npm install --no-save selenium-webdriver
      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable
      - name: Run native Safari smoke tests against production
        env:
          FC_SITE_ORIGIN: https://friendlycalculator.in
        run: node tests/safari-smoke.cjs
