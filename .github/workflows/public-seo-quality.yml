name: Public SEO metadata quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  public-seo-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add missing public social metadata without replacing existing content
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/homepage-catalogue-copy-20261120'
        run: |
          node scripts/repair-public-social-metadata.cjs --write
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "Repair missing public social metadata"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Check public page metadata
        run: node scripts/repair-public-social-metadata.cjs --check
      - name: Run SEO publication tests
        run: node --test tests/public-seo-quality.test.cjs
