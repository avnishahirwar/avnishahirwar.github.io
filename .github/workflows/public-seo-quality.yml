name: Public SEO metadata quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  public-seo-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public page metadata
        run: node scripts/repair-public-social-metadata.cjs --write && node scripts/repair-public-social-metadata.cjs --check
      - name: Run SEO publication tests
        run: node --test tests/public-seo-quality.test.cjs
      - name: Commit additive public metadata repairs on main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): repair public social metadata"
            git push
          else
            echo "Public social metadata is already complete."
          fi
