name: Public SEO metadata quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  public-seo-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair missing public SEO metadata
        run: node scripts/repair-public-social-metadata.cjs --write
      - name: Verify metadata repair is complete
        run: node scripts/repair-public-social-metadata.cjs --check
      - name: Commit additive metadata repairs to the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain -- '*.html')" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html'
            git commit -m "Repair missing public SEO metadata"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "No HTML metadata changes to commit."
          fi
      - name: Run SEO publication tests
        run: node --test tests/public-seo-quality.test.cjs
