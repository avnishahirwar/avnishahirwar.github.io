name: One-time technical SEO repair and regeneration
on:
  push:
    branches:
      - fix/technical-seo-audit-hreflang-20261125
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add only unambiguous reciprocal hreflang tags
        run: |
          node scripts/add-hreflang-reciprocals.cjs --write
          node scripts/add-hreflang-reciprocals.cjs
      - name: Rebuild generated calculator directory and XML sitemaps
        run: |
          node scripts/build-site-directory.cjs
          node scripts/generate-sitemaps.cjs
          node scripts/build-site-directory.cjs --check
          node scripts/generate-sitemaps.cjs --check
      - name: Remove one-time workflow and commit generated repairs
        run: |
          rm .github/workflows/one-time-technical-seo-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' '*.xml' scripts/build-site-directory.cjs tests/global-expansion.test.cjs tests/global-fx-hreflang.test.cjs tests/calculator-formulas.test.cjs .github/workflows/one-time-technical-seo-repair.yml
          git commit -m "seo: add reciprocal hreflang and crawlable directory navigation [skip ci]"
          git push
