name: Merge search index additions

on:
  push:
    branches: [main]
    paths:
      - 'assets/calculator-search-index-additions.json'
      - 'scripts/merge-search-index.cjs'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/merge-search-index.cjs && node --check scripts/build-physics-directory-index.cjs
      - name: Preserve full Physics directory source before SEO index pruning
        run: node scripts/build-physics-directory-index.cjs
      - name: Generate canonical sitemap before search-index reconciliation
        run: node scripts/generate-sitemaps.cjs
      - name: Reconcile search index to canonical published calculator pages
        run: node scripts/merge-search-index.cjs
      - run: node scripts/merge-search-index.cjs --check
      - name: Build and validate the merged catalogue and count surfaces
        run: |
          node scripts/sync-calculator-counts.cjs
          node scripts/generate-human-sitemap.cjs
          node scripts/build-site-directory.cjs
          node scripts/sync-calculator-counts.cjs --check
          node scripts/generate-human-sitemap.cjs --check
          node scripts/generate-sitemaps.cjs --check
          node --test tests/calculator-counts.test.cjs
      - run: node --check scripts/sync-calculator-counts.cjs

  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preserve full Physics directory source before SEO index pruning
        run: node scripts/build-physics-directory-index.cjs
      - name: Generate canonical sitemap before search-index reconciliation
        run: node scripts/generate-sitemaps.cjs
      - name: Reconcile search index to canonical published calculator pages
        run: node scripts/merge-search-index.cjs
      - name: Synchronize every public calculator count
        run: node scripts/sync-calculator-counts.cjs
      - name: Regenerate the human-readable sitemap
        run: node scripts/generate-human-sitemap.cjs
      - name: Verify synchronized counts and sitemap
        run: node scripts/sync-calculator-counts.cjs --check && node scripts/generate-human-sitemap.cjs --check
      - name: Commit updated index, count surfaces and human sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            assets/calculator-search-index.json \
            assets/physics-directory-index.json \
            index.html \
            calculator/about.html \
            calculator/api.html \
            calculator/site-directory.html \
            calculators/gst-calculator.html \
            calculators/salary-calculator.html \
            hi/calculator/about.html \
            hi/calculator/site-directory.html \
            sitemap.html \
            ':(glob)*/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "chore(catalogue): synchronize calculator index and public counts"
            git push
          else
            echo "Search index, counts and human sitemap are already up to date."
          fi
