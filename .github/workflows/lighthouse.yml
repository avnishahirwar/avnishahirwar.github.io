name: Lighthouse and Core Web Vitals (lab)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lighthouse.yml"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "assets/page-calculators.js"
      - "assets/loan-emi-calculator.js"
      - "calculators/loan-emi-calculator.html"
      - "calculators/gst-calculator.html"
      - "assets/page-calculators.js"
      - "calculator/site-directory.html"
      - "international/index.html"
      - "index.html"
      - "calculators/minutes-to-hours-calculator.html"
      - "_headers"
      - "calculator/about.html"
      - "calculator/finance-calculators.html"
      - "international/index.html"
      - "calculator/tax.html"
      - "calculator/methodology.html"
      - "calculator/legal-compliance.html"
      - "calculators/mortgage-calculator.html"
      - "calculators/sip-calculator.html"
      - "calculators/income-tax-calculator.html"
  pull_request:
    paths:
      - ".github/workflows/lighthouse.yml"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "assets/page-calculators.js"
      - "assets/loan-emi-calculator.js"
      - "calculators/loan-emi-calculator.html"
      - "calculator/site-directory.html"
      - "index.html"
      - "assets/calculator-search-index.json"
      - "calculators/minutes-to-hours-calculator.html"
      - "tests/mobile-schema.test.cjs"
      - "_headers"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse mobile audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Chrome
        run: google-chrome --version

      - name: Wait for GitHub Pages to publish the updated calculator assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            html="$(curl -fsSL "https://friendlycalculator.in/calculators/loan-emi-calculator.html?deploy=${GITHUB_SHA}" || true)"
            js="$(curl -fsSL "https://friendlycalculator.in/assets/loan-emi-calculator.js?deploy=${GITHUB_SHA}" || true)"
            directory="$(curl -fsSL "https://friendlycalculator.in/calculator/site-directory.html?deploy=${GITHUB_SHA}" || true)"
            legal="$(curl -fsSL "https://friendlycalculator.in/calculator/legal-compliance.html?deploy=${GITHUB_SHA}" || true)"
            international="$(curl -fsSL "https://friendlycalculator.in/international/?deploy=${GITHUB_SHA}" || true)"
            if grep -q 'src="/assets/loan-emi-calculator.js"' <<<"$html" && grep -q "function calculateLoanEmi" <<<"$js" && grep -q 'fetchpriority="high"' <<<"$directory" && grep -q '<title>Legal &amp; Compliance | Friendly Calculator</title>' <<<"$legal" && grep -q '.hero .links a{color:#e6d6b2' <<<"$international"; then
              echo "Production calculator assets match commit ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment (attempt ${attempt}/30)..."
            sleep 20
          done
          echo "::error::Production did not publish the expected assets within 10 minutes."
          exit 1

      - name: Run Lighthouse across representative site-wide page types and languages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-results
          printf '| Page | Performance | Accessibility | Best Practices | SEO | LCP (s) | CLS | TBT (ms) |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r name url; do
            echo "Auditing $url"
            npx --yes lighthouse@12 "$url" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-results/$name.json" \
              --quiet
            jq -r --arg name "$name" '
              "| " + $name +
              " | " + (((.categories.performance.score // 0) * 100 | round) | tostring) +
              " | " + (((.categories.accessibility.score // 0) * 100 | round) | tostring) +
              " | " + (((.categories["best-practices"].score // 0) * 100 | round) | tostring) +
              " | " + (((.categories.seo.score // 0) * 100 | round) | tostring) +
              " | " + (((.audits["largest-contentful-paint"].numericValue // 0) / 1000 * 100 | round) / 100 | tostring) +
              " | " + (((.audits["cumulative-layout-shift"].numericValue // 0) * 1000 | round) / 1000 | tostring) +
              " | " + (((.audits["total-blocking-time"].numericValue // 0) | round) | tostring) +
              " |"
            ' "lighthouse-results/$name.json" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Top optimization opportunities ($name):"
            jq -r '[.audits[] | select(.details.type == "opportunity" and (.details.overallSavingsMs // 0) > 0) | {title: .title, ms: ((.details.overallSavingsMs // 0) | round)}] | sort_by(.ms) | reverse | .[:5][] | "- " + .title + " (" + (.ms | tostring) + " ms saved)"' "lighthouse-results/$name.json"
            echo "Layout-shift elements ($name):"
            jq -r '(.audits["layout-shift-elements"].details.items // [])[:5][] | "- " + (.node.selector // "unknown") + " — " + (.node.snippet // "") + " (score " + ((.score // 0) | tostring) + ")"' "lighthouse-results/$name.json"
            echo "LCP element ($name):"
            jq -r '.audits["largest-contentful-paint-element"].details.items[0].node.snippet // "not reported"' "lighthouse-results/$name.json"
          done <<'URLS'
          homepage|https://friendlycalculator.in/
          directory|https://friendlycalculator.in/calculator/site-directory.html
          gst-calculator|https://friendlycalculator.in/calculators/gst-calculator.html
          loan-emi|https://friendlycalculator.in/calculators/loan-emi-calculator.html
          minutes-to-hours|https://friendlycalculator.in/calculators/minutes-to-hours-calculator.html
          finance-category|https://friendlycalculator.in/calculator/finance-calculators.html
          tax-category|https://friendlycalculator.in/calculator/tax.html
          income-tax|https://friendlycalculator.in/calculators/income-tax-calculator.html
          sip-calculator|https://friendlycalculator.in/calculators/sip-calculator.html
          mortgage-calculator|https://friendlycalculator.in/calculators/mortgage-calculator.html
          methodology|https://friendlycalculator.in/calculator/methodology.html
          about|https://friendlycalculator.in/calculator/about.html
          international-home|https://friendlycalculator.in/international/
          blog-home|https://friendlycalculator.in/blog/
          hindi-home|https://friendlycalculator.in/hi/index.html
          spanish-home|https://friendlycalculator.in/es/index.html
          legal-compliance|https://friendlycalculator.in/calculator/legal-compliance.html
          URLS

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Lab data is not field Core Web Vitals. Total Blocking Time (TBT) is a lab diagnostic, not field Interaction to Next Paint (INP). Field CWV should be checked separately in Search Console / CrUX." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: friendly-calculator-lighthouse
          path: lighthouse-results/*.json
          retention-days: 7
