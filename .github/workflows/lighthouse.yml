name: Lighthouse and Core Web Vitals (lab)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lighthouse.yml"
      - "sw.js"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "scripts/check-site-shell-runtime.cjs"
      - "assets/page-calculators.js"
      - "assets/loan-emi-calculator.js"
      - "calculators/loan-emi-calculator.html"
      - "calculators/gst-calculator.html"
      - "assets/page-calculators.js"
      - "calculator/site-directory.html"
      - "international/index.html"
      - "index.html"
      - "calculators/minutes-to-hours-calculator.html"
      - "_headers"
      - "calculator/about.html"
      - "calculator/finance-calculators.html"
      - "international/index.html"
      - "calculator/tax.html"
      - "calculator/methodology.html"
      - "calculator/legal-compliance.html"
      - "calculators/mortgage-calculator.html"
      - "calculators/sip-calculator.html"
      - "calculators/income-tax-calculator.html"
  pull_request:
    paths:
      - ".github/workflows/lighthouse.yml"
      - "sw.js"
      - "assets/site-shell.js"
      - "assets/site-shell.css"
      - "assets/page-calculators.js"
      - "assets/loan-emi-calculator.js"
      - "calculators/loan-emi-calculator.html"
      - "calculator/site-directory.html"
      - "index.html"
      - "assets/calculator-search-index.json"
      - "calculators/minutes-to-hours-calculator.html"
      - "calculators/income-tax-calculator.html"
      - "calculator/finance-calculators.html"
      - "tests/mobile-schema.test.cjs"
      - "tests/cross-browser-smoke.cjs"
      - "tests/safari-smoke.cjs"
      - "scripts/check-site-shell-runtime.cjs"
      - "_headers"

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  lighthouse:
    name: Lighthouse mobile audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: https://friendlycalculator.in
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Chrome
        run: google-chrome --version

      - name: Check shared-shell browser smoke test syntax
        run: node --check scripts/check-site-shell-runtime.cjs

      - name: Wait for GitHub Pages to publish the updated calculator assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            html="$(curl -fsSL "${BASE_URL}/calculators/loan-emi-calculator.html?deploy=${GITHUB_SHA}" || true)"
            js="$(curl -fsSL "${BASE_URL}/assets/loan-emi-calculator.js?deploy=${GITHUB_SHA}" || true)"
            directory="$(curl -fsSL "${BASE_URL}/calculator/site-directory.html?deploy=${GITHUB_SHA}" || true)"
            legal="$(curl -fsSL "${BASE_URL}/calculator/legal-compliance.html?deploy=${GITHUB_SHA}" || true)"
            international="$(curl -fsSL "${BASE_URL}/international/?deploy=${GITHUB_SHA}" || true)"
            shell="$(curl -fsSL "${BASE_URL}/assets/site-shell.js?deploy=${GITHUB_SHA}" || true)"
            shell_css="$(curl -fsSL "${BASE_URL}/assets/site-shell.css?deploy=${GITHUB_SHA}" || true)"
            service_worker="$(curl -fsSL "${BASE_URL}/sw.js?deploy=${GITHUB_SHA}" || true)"
            if grep -Eq "const CACHE_NAME = 'friendly-calculator-public-v[0-9]+'" <<<"$service_worker" && grep -q "__fc_home_refresh" <<<"$service_worker" && grep -q 'src="/assets/loan-emi-calculator.js"' <<<"$html" && grep -q "function calculateLoanEmi" <<<"$js" && grep -q 'fetchpriority="high"' <<<"$directory" && grep -q '<title>Legal &amp; Compliance | Friendly Calculator</title>' <<<"$legal" && grep -q '.hero .links a{color:#e6d6b2' <<<"$international" && grep -q "const footerNavigation=document.querySelector('footer.fc-global-footer .fc-global-footer-links')" <<<"$shell" && grep -q "const assistantLauncher=document.getElementById('fc-ai-lazy-launch')" <<<"$shell" && grep -q "quickActions.appendChild(installButton)" <<<"$shell" && grep -q '#fc-ai-lazy-launch{position:fixed' <<<"$shell_css"; then
              echo "Production calculator assets and refreshed service worker match commit ${GITHUB_SHA}."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment (attempt ${attempt}/30)..."
            sleep 20
          done
          echo "::error::Production did not publish the expected assets within 10 minutes."
          exit 1

      - name: Verify shared Header/Footer and Settings dock in a real browser
        if: github.event_name == 'push'
        run: node scripts/check-site-shell-runtime.cjs

      - name: Select Cloudflare or free local pull-request preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          slug="$(printf '%s' "$GITHUB_HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-28 | sed -E 's/-+$//')"
          base_url=""
          for attempt in {1..10}; do
            comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --jq '.[].body' 2>/dev/null || true)"
            candidate="$(grep -Eo "https://$slug(-[a-z0-9-]+)?\\.friendly-calculator\\.pages\\.dev" <<<"$comments" | tail -n1 || true)"
            if [ -z "$candidate" ]; then
              candidate="$(grep -Eo "https://deploy-preview-$PR_NUMBER--[a-z0-9-]+\\.netlify\\.app" <<<"$comments" | tail -n1 || true)"
            fi
            if [ -n "$candidate" ]; then
              # A hosted preview must remain on its own origin. Cloudflare account-level
              # redirect rules can send *.pages.dev to production, which would make
              # Lighthouse measure the live site instead of this pull-request checkout.
              effective_page_url="$(curl -fsSL -o /dev/null -w '%{url_effective}' "$candidate/calculators/income-tax-calculator.html" || true)"
              case "$effective_page_url" in
                "$candidate"/*)
                  html="$(curl -fsSL "$candidate/calculators/income-tax-calculator.html" || true)"
                  service_worker="$(curl -fsSL "$candidate/sw.js" || true)"
                  if grep -q 'fc-calculator-reserved' <<<"$html" && grep -Eq "const CACHE_NAME = 'friendly-calculator-public-v[0-9]+'" <<<"$service_worker" && grep -q "__fc_home_refresh" <<<"$service_worker"; then
                    base_url="$candidate"
                    echo "Using published pull-request preview: $base_url"
                    break
                  fi
                  ;;
                *)
                  echo "Hosted preview redirected off-origin to '$effective_page_url'; rejecting it so Lighthouse cannot silently audit production."
                  ;;
              esac
            fi
            echo "Waiting for an optional Cloudflare/Netlify preview comment (attempt $attempt/10)."
            sleep 10
          done

          if [ -z "$base_url" ]; then
            echo "No hosted preview was published; starting a zero-cost local static preview of this PR checkout."
            python3 - <<'PY' >/tmp/fc-local-preview.log 2>&1 &
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          class PreviewHandler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  parsed = urlsplit(self.path)
                  path = unquote(parsed.path)
                  if path != "/" and not path.endswith("/") and "." not in Path(path).name:
                      candidate = Path("." + path + ".html")
                      if candidate.is_file():
                          location = path + ".html" + (("?" + parsed.query) if parsed.query else "")
                          self.send_response(301)
                          self.send_header("Location", location)
                          self.end_headers()
                          return
                  super().do_GET()

          ThreadingHTTPServer(("127.0.0.1", 4173), PreviewHandler).serve_forever()
          PY
            for attempt in {1..20}; do
              if curl -fsS "http://127.0.0.1:4173/calculators/income-tax-calculator.html" >/tmp/fc-preview-income-tax.html; then
                base_url="http://127.0.0.1:4173"
                break
              fi
              sleep 1
            done
            if [ -z "$base_url" ]; then
              cat /tmp/fc-local-preview.log || true
              echo "::error::Local static preview could not be started."
              exit 1
            fi
            html="$(cat /tmp/fc-preview-income-tax.html)"
            service_worker="$(curl -fsSL "$base_url/sw.js")"
            if ! grep -q 'fc-calculator-reserved' <<<"$html" || ! grep -Eq "const CACHE_NAME = 'friendly-calculator-public-v[0-9]+'" <<<"$service_worker" || ! grep -q "__fc_home_refresh" <<<"$service_worker"; then
              echo "::error::Local static preview does not contain the expected calculator and service-worker markers."
              exit 1
            fi
          fi

          echo "BASE_URL=$base_url" >> "$GITHUB_ENV"
      - name: Verify shared Header/Footer and Settings on the pull-request preview in Chrome
        if: github.event_name == 'pull_request'
        run: FC_SITE_ORIGIN="$BASE_URL" node scripts/check-site-shell-runtime.cjs

      - name: Run Lighthouse across representative site-wide page types and languages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-results
          printf '| Page | Performance | Accessibility | Best Practices | SEO | LCP (s) | CLS | TBT (ms) |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r name url; do
            echo "Auditing $url"
            npx --yes lighthouse@12 "$url" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="lighthouse-results/$name.json" \
              --quiet
            jq -r --arg name "$name" '
              "| " + $name +
              " | " + (((.categories.performance.score // 0) * 100 | round) | tostring) +
              " | " + (((.categories.accessibility.score // 0) * 100 | round) | tostring) +
              " | " + (((.categories["best-practices"].score // 0) * 100 | round) | tostring) +
              " | " + (((.categories.seo.score // 0) * 100 | round) | tostring) +
              " | " + (((.audits["largest-contentful-paint"].numericValue // 0) / 1000 * 100 | round) / 100 | tostring) +
              " | " + (((.audits["cumulative-layout-shift"].numericValue // 0) * 1000 | round) / 1000 | tostring) +
              " | " + (((.audits["total-blocking-time"].numericValue // 0) | round) | tostring) +
              " |"
            ' "lighthouse-results/$name.json" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Top optimization opportunities ($name):"
            jq -r '[.audits[] | select(.details.type == "opportunity" and (.details.overallSavingsMs // 0) > 0) | {title: .title, ms: ((.details.overallSavingsMs // 0) | round)}] | sort_by(.ms) | reverse | .[:5][] | "- " + .title + " (" + (.ms | tostring) + " ms saved)"' "lighthouse-results/$name.json"
            echo "Layout-shift elements ($name):"
            jq -r '(.audits["layout-shift-elements"].details.items // [])[:5][] | "- " + (.node.selector // "unknown") + " — " + (.node.snippet // "") + " (score " + ((.score // 0) | tostring) + ")"' "lighthouse-results/$name.json"
            echo "LCP element ($name):"
            jq -r '.audits["largest-contentful-paint-element"].details.items[0].node.snippet // "not reported"' "lighthouse-results/$name.json"
            echo "Redirect chain details ($name):"
            jq -r '(.audits.redirects.details.items // [])[:8][] | "- " + (.url // "unknown URL") + " -> " + (.redirectTarget // .finalUrl // "redirect target not reported")' "lighthouse-results/$name.json"
            echo "Render-blocking resource details ($name):"
            jq -r '(.audits["render-blocking-resources"].details.items // [])[:8][] | "- " + (.url // .request.url // "unknown URL") + " (" + (((.wastedMs // 0) | round) | tostring) + " ms)"' "lighthouse-results/$name.json"
            echo "CLS audit diagnostics ($name):"
            jq -r '{layout_shift_elements: .audits["layout-shift-elements"].details.items[:8], layout_shift_culprits: .audits["layout-shift-culprits"].details.items[:8], layout_shifts: .audits["layout-shifts"].details.items[:8]} | to_entries[] | .key as $key | (.value // [])[]? | "- " + $key + ": " + ((.node.selector // .node.snippet // .url // .reason // .summary // "diagnostic detail unavailable") | tostring)' "lighthouse-results/$name.json"
          done <<URLS
          homepage|${BASE_URL}/
          directory|${BASE_URL}/calculator/site-directory.html
          gst-calculator|${BASE_URL}/calculators/gst-calculator.html
          income-tax|${BASE_URL}/calculators/income-tax-calculator.html
          mortgage-calculator|${BASE_URL}/calculators/mortgage-calculator.html
          hindi-home|${BASE_URL}/hi/index.html
          international-home|${BASE_URL}/international/
          legal-compliance|${BASE_URL}/calculator/legal-compliance.html
          URLS

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Lab data is not field Core Web Vitals. Total Blocking Time (TBT) is a lab diagnostic, not field Interaction to Next Paint (INP). Field CWV should be checked separately in Search Console / CrUX." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: friendly-calculator-lighthouse
          path: lighthouse-results/*.json
          retention-days: 7
