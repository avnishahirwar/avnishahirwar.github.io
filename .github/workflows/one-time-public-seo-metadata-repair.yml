name: One-time public SEO metadata repair
on:
  push:
    branches:
      - seo/run-public-metadata-repair
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the SEO repair branch
        uses: actions/checkout@v4
        with:
          ref: seo/repair-public-social-metadata
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add missing public Open Graph and Twitter metadata
        run: node scripts/repair-public-social-metadata.cjs --write
      - name: Verify all public pages now have social metadata
        run: node scripts/repair-public-social-metadata.cjs --check
      - name: Add safe reciprocal hreflang alternates for published translations
        run: node scripts/add-hreflang-reciprocals.cjs --write
      - name: Verify reciprocal hreflang repair is complete
        run: node scripts/add-hreflang-reciprocals.cjs --check
      - name: Add missing calculator search-index entries
        run: node scripts/repair-calculator-search-index.cjs --write
      - name: Verify the complete calculator search index
        run: node scripts/repair-calculator-search-index.cjs --check
      - name: Rebuild the public human sitemap
        run: node scripts/repair-human-sitemap.cjs --write
      - name: Verify the public human sitemap
        run: node scripts/repair-human-sitemap.cjs --check
      - name: Rebuild the complete About page calculator list
        run: node scripts/repair-about-calculator-list.cjs --write
      - name: Verify the About page calculator list
        run: node scripts/repair-about-calculator-list.cjs --check
      - name: Commit metadata-only repairs to the open SEO pull request
        env:
          BRANCH: seo/repair-public-social-metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No metadata changes were needed."
            exit 0
          fi
          git commit -m "Add missing social metadata to public pages"
          git push origin "HEAD:refs/heads/$BRANCH"
