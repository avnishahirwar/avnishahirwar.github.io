name: Production optimization audit
on:
  push:
    branches: [production-optimization]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/production-optimization-audit.cjs'
      - 'tests/production-optimization-audit.test.cjs'
      - '.github/workflows/production-optimization-audit.yml'
      - '**/*.html'
      - 'sitemap*.xml'
      - '_headers'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test audit rules
        run: node --test tests/production-optimization-audit.test.cjs
      - name: Scan repository and generate reports
        run: node scripts/production-optimization-audit.cjs --write-report
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: friendly-calculator-production-optimization-audit
          path: reports/production-optimization/
          if-no-files-found: error
          retention-days: 30
