name: One-time all-locale shared UI regression
on:
  push:
    branches:
      - feat/localize-shared-navigation-all-50-v4-20261125
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all 50 configured locale dictionaries
        run: node --test tests/language-routing.test.cjs
      - name: Remove one-time workflow
        run: |
          rm .github/workflows/one-time-all-locale-ui-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-time-all-locale-ui-regression.yml
          git commit -m "ci: remove one-time all-locale UI regression workflow [skip ci]"
          git push
