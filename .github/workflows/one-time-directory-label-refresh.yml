name: One-time generated directory label refresh
on:
  push:
    branches:
      - fix/technical-seo-audit-hreflang-20261125
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate and validate the calculator directory
        run: |
          node scripts/build-site-directory.cjs
          node scripts/build-site-directory.cjs --check
      - name: Remove workflow and commit generated directory
        run: |
          rm -f .github/workflows/one-time-directory-label-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-site-directory.cjs calculator/site-directory.html .github/workflows/one-time-directory-label-refresh.yml
          if ! git diff --cached --quiet; then git commit -m "seo: label international calculator directory navigation [skip ci]"; fi
          git fetch origin fix/technical-seo-audit-hreflang-20261125
          git rebase origin/fix/technical-seo-audit-hreflang-20261125
          git push origin HEAD:fix/technical-seo-audit-hreflang-20261125
