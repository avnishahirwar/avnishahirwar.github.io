name: Preview hostname redirect tests
on:
  pull_request:
    paths:
      - "functions/_middleware.js"
      - "netlify/edge-functions/preview-host-redirect.js"
      - "tests/preview-host-redirect.test.cjs"
      - ".github/workflows/preview-redirect-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-redirect-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Cloudflare Pages and Netlify preview redirects
        run: node --test tests/preview-host-redirect.test.cjs
