name: Temporary site directory regeneration

on:
  push:
    branches:
      - fix/site-directory-crawlable-nav-current-main-20261125

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-site-directory.cjs
      - name: Commit generated directory if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator/site-directory.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): regenerate site directory"
            git push
          fi
