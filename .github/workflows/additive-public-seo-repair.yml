name: One-time additive public SEO repairs

on:
  push:
    branches:
      - seo/additive-public-metadata-hreflang-2026-11-21

permissions:
  contents: write

jobs:
  additive-seo-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repair script syntax
        run: |
          node --check scripts/repair-public-social-metadata.cjs
          node --check scripts/add-hreflang-reciprocals.cjs
      - name: Add missing public social metadata only
        run: node scripts/repair-public-social-metadata.cjs --write
      - name: Add only unambiguous reciprocal hreflang tags
        run: node scripts/add-hreflang-reciprocals.cjs --write
      - name: Verify public metadata quality
        run: |
          node scripts/repair-public-social-metadata.cjs --check
          node --test tests/public-seo-quality.test.cjs
      - name: Verify reciprocal hreflang repair is complete and additive
        run: node --test tests/international-seo-diagnostic.test.cjs
      - name: Commit additive HTML metadata and hreflang updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "seo: add missing public social metadata and hreflang reciprocals [skip ci]"
            git push
          else
            echo "No eligible additive SEO repairs were missing."
          fi
