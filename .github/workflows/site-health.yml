name: Site health and link checks
# Catalogue expansion validation includes the seventeen new math calculator routes.
on:
  pull_request:
  push:
    branches: [main, feature/rural-decision-tools-20261113, feature/property-agriculture-embed-finish-20261113]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
concurrency:
  group: friendly-calculator-site-health
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  site-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate current sitemap for repository QA
        run: node scripts/generate-sitemaps.cjs
      - name: Generate curated programmatic SEO pages
        run: node scripts/generate-programmatic-seo.cjs
      - name: Validate programmatic SEO pages
        run: node --test tests/programmatic-seo.test.cjs
      - name: Validate global expansion landing pages
        run: node --test tests/global-expansion.test.cjs
      - name: Validate sitemap, metadata and local links
        run: node --test tests/site-integrity.test.cjs
      - name: Validate calculator formulas
        run: node --test tests/calculator-formulas.test.cjs
      - name: Validate international calculator formulas\n        run: node --test tests/international-calculators.test.cjs\n      - name: Validate insurance premium calculator
        run: node --test tests/insurance-premium-calculator.test.cjs
      - name: Validate graphing calculator
        run: node --test tests/graphing-calculator.test.cjs
      - name: Validate property calculators and embeds
        run: node --test tests/property-tools.test.cjs
      - name: Validate SEO consolidation and sitemap exclusions
        run: node --test tests/seo-consolidation.test.cjs
      - name: Validate multilingual route switching
        run: node --test tests/language-routing.test.cjs
      - name: Validate Hindi rural calculator localization
        run: node --test tests/hindi-rural-localization.test.cjs
      - name: Validate free smart assistant privacy and integration
        run: node --test tests/free-smart-assistant.test.cjs
      - name: Validate mobile calculator layouts and structured data
        run: node --test tests/mobile-schema.test.cjs
      - name: Check calculator-only embed mode
        run: node --test tests/embed-mode.test.cjs
      - name: Check shared JavaScript syntax
        run: node --check assets/asia-pacific-tax-pages.js && node --check assets/country-tax-pages.js && node --check assets/friendly-ai-assistant.js && node --check assets/site-shell.js && node --check assets/page-calculators.js && node --check assets/extra-calculators.js && node --check assets/extended-science-astrology.js && node --check assets/phase5-custom-calculators.js && node --check assets/rural-tools.js && node --check assets/matrix-calculator.js && node --check assets/image-tools.js && node --check assets/graphing-calculator.js
