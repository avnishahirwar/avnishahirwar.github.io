name: Site health and link checks
on:
  pull_request:
  push:
    branches: [main, feature/rural-decision-tools-20261113, feature/property-agriculture-embed-finish-20261113]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
concurrency:
  group: friendly-calculator-site-health
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  site-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate sitemap, metadata and local links
        run: node --test tests/site-integrity.test.cjs
      - name: Validate calculator formulas
        run: node --test tests/calculator-formulas.test.cjs
      - name: Validate property calculators and embeds
        run: node --test tests/property-tools.test.cjs
      - name: Validate SEO consolidation and sitemap exclusions
        run: node --test tests/seo-consolidation.test.cjs
      - name: Validate multilingual route switching
        run: node --test tests/language-routing.test.cjs
      - name: Validate Hindi rural calculator localization
        run: node --test tests/hindi-rural-localization.test.cjs
      - name: Validate free smart assistant privacy and integration
        run: node --test tests/free-smart-assistant.test.cjs
      - name: Check shared JavaScript syntax
        run: node --check assets/friendly-ai-assistant.js && node --check assets/site-shell.js && node --check assets/page-calculators.js && node --check assets/extra-calculators.js && node --check assets/phase5-custom-calculators.js && node --check assets/rural-tools.js
