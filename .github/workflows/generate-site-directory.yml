name: Generate calculator site directory

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-site-directory.cjs'
      - 'calculators/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-site-directory.cjs'
      - 'calculator/site-directory.html'
      - 'calculators/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/build-site-directory.cjs
      - run: node scripts/build-site-directory.cjs --check

  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild calculator/site-directory.html from the catalogue
        run: node scripts/build-site-directory.cjs
      - name: Commit the regenerated directory when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator/site-directory.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): regenerate calculator site-directory from catalogue"
            git push
          else
            echo "site-directory.html is already up to date."
          fi
