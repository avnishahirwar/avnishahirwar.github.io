name: Generate calculator site directory

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-site-directory.cjs'
      - 'scripts/sync-calculator-counts.cjs'
      - 'config/site-directory-category-assignments.json'
      - 'index.html'
      - 'sitemap.xml'
      - 'assets/calculator-search-index.json'
      - 'calculator/site-directory.html'
      - 'hi/calculator/site-directory.html'
      - 'tests/calculator-counts.test.cjs'
      - 'tests/site-integrity.test.cjs'
      - 'calculators/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-site-directory.cjs'
      - 'calculator/site-directory.html'
      - 'config/site-directory-category-assignments.json'
      - 'index.html'
      - 'sitemap.xml'
      - 'assets/calculator-search-index.json'
      - 'tests/calculator-counts.test.cjs'
      - 'tests/site-integrity.test.cjs'
      - 'calculators/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/build-site-directory.cjs
      - run: node scripts/build-site-directory.cjs --check
      - run: node scripts/sync-calculator-counts.cjs --check

  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild the curated calculator directory from the canonical sitemap
        run: node scripts/build-site-directory.cjs
      - name: Synchronize homepage and catalogue counters
        run: node scripts/sync-calculator-counts.cjs
      - name: Commit the regenerated directory when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): rebuild curated calculator directory and counts"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo "site-directory.html is already up to date."
          fi
