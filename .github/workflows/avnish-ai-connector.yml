name: Avnish AI Connector CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "avnish-ai-connector/**"
      - ".github/workflows/avnish-ai-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avnish-ai-connector-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, Worker build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: avnish-ai-connector
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 4

      - name: TypeScript validation
        run: npm run typecheck
        timeout-minutes: 2

      - name: Wrangler dry-run build
        run: npm run build
        timeout-minutes: 3

      - name: Local Worker HTTP smoke tests
        run: npm run smoke
        timeout-minutes: 2
