name: Avnish AI Connector CI

on:
  push:
    branches:
      - feat/avnish-ai-mcp-scaffold
    paths:
      - "avnish-ai-connector/**"
      - ".github/workflows/avnish-ai-connector.yml"
  pull_request:
    branches:
      - main
    paths:
      - "avnish-ai-connector/**"
      - ".github/workflows/avnish-ai-connector.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avnish-ai-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and Worker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: avnish-ai-connector
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: avnish-ai-connector/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build Worker
        run: npm run validate
