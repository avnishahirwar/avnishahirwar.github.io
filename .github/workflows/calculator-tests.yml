name: Calculator formula tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  calculator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculator regression tests
        run: node --test tests/calculator-formulas.test.cjs
