name: One-time public catalogue and hreflang reconciliation

on:
  push:
    branches:
      - seo/catalogue-hreflang-reconciliation-20261128

permissions:
  contents: write

jobs:
  reconcile:
    if: \${{ !contains(github.event.head_commit.message, 'generated canonical catalogue and hreflang') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate the sitemap from indexable self-canonical pages
        run: node scripts/generate-sitemaps.cjs
      - name: Rebuild the public search index from the canonical sitemap
        run: node scripts/merge-search-index.cjs
      - name: Rebuild the curated calculator directory
        run: node scripts/build-site-directory.cjs
      - name: Rebuild the Physics subject directory
        run: node scripts/generate-physics-calculator-directory.cjs
      - name: Synchronize published catalogue counts
        run: node scripts/sync-calculator-counts.cjs
      - name: Rebuild the human-readable sitemap
        run: node scripts/generate-human-sitemap.cjs
      - name: Normalize hreflang to indexable self-canonical locale groups
        run: node scripts/normalize-hreflang.cjs --write
      - name: Regenerate XML sitemaps after metadata normalization
        run: node scripts/generate-sitemaps.cjs && node scripts/generate-locale-sitemaps.cjs
      - name: Verify generated data and metadata
        run: |
          node scripts/normalize-hreflang.cjs --check
          node scripts/generate-sitemaps.cjs --check
          node scripts/generate-locale-sitemaps.cjs --check
          node scripts/merge-search-index.cjs --check
          node scripts/build-site-directory.cjs --check
          node scripts/generate-physics-calculator-directory.cjs --check
          node scripts/sync-calculator-counts.cjs --check
          node scripts/generate-human-sitemap.cjs --check
          node --test tests/normalize-hreflang.test.cjs
          node --test tests/international-seo.test.cjs
      - name: Commit only generated catalogue, sitemap and HTML metadata outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/reconcile-public-catalogue-once.yml
          git add -A -- ':(glob)**/*.html' 'sitemap*.xml' 'assets/calculator-search-index.json'
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): generated canonical catalogue and hreflang"
            git push
          else
            echo "Generated catalogue and hreflang outputs are already synchronized."
          fi
