name: One-time additive hreflang reciprocal repair

on:
  workflow_dispatch:
  push:
    branches:
      - seo/additive-hreflang-reciprocals-2026-11-28

permissions:
  contents: write

jobs:
  add-only-reciprocals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore HTML inputs from the main branch
        run: git checkout origin/main -- '*.html'
      - name: Check repair script syntax
        run: node --check scripts/add-hreflang-reciprocals.cjs
      - name: Add only unambiguous reciprocal links
        run: node scripts/add-hreflang-reciprocals.cjs --write
      - name: Verify additive repair is complete and non-destructive
        run: CHECK_HREFLANG_ADDITIVE_REPAIR=true GITHUB_BASE_REF=main node --test tests/international-seo-diagnostic.test.cjs
      - name: Commit additive page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t changed_html < <(git diff --name-only origin/main -- '*.html')
          printf 'HTML files differing from main: %s\n' "${#changed_html[@]}"
          if [ "${#changed_html[@]}" -eq 0 ]; then
            echo "Expected generated HTML changes, but none were found."
            exit 1
          fi
          for file in "${changed_html[@]}"; do
            git add -f -- "$file"
          done
          echo "Staged HTML changes:"
          git diff --cached --stat -- '*.html'
          if git diff --cached --quiet; then
            echo "Expected HTML modifications were not staged."
            exit 1
          fi
          git commit -m "seo: add missing hreflang reciprocals [skip ci]"
          git push
