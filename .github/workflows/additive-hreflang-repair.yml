name: One-time additive hreflang reciprocal repair

on:
  push:
    branches:
      - seo/additive-hreflang-reciprocals-2026-11-16

permissions:
  contents: write

jobs:
  add-only-reciprocals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repair script syntax
        run: node --check scripts/add-hreflang-reciprocals.cjs
      - name: Add only unambiguous reciprocal links
        run: node scripts/add-hreflang-reciprocals.cjs --write
      - name: Commit additive page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "seo: add missing hreflang reciprocals [skip ci]"
            git push
          else
            echo "No safe additive reciprocal links were missing."
          fi
