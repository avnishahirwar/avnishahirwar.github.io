name: AdSense page-quality audit
on:
  pull_request:
    paths:
      - 'scripts/adsense-page-quality-audit.cjs'
      - 'tests/adsense-page-quality-audit.test.cjs'
      - '.github/workflows/adsense-page-quality-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run audit unit tests
        run: node --test tests/adsense-page-quality-audit.test.cjs
      - name: Generate full page-quality inventory
        run: node scripts/adsense-page-quality-audit.cjs
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: adsense-page-quality-audit
          path: |
            artifacts/adsense-page-quality-audit.json
            artifacts/adsense-page-quality-audit.md
          if-no-files-found: error
