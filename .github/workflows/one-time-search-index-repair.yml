name: One-time calculator search-index repair
on:
  push:
    branches:
      - fix/run-search-index-repair
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/50-locale-regression-and-search-index
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add missing canonical calculator entries
        run: node scripts/repair-calculator-search-index.cjs --write
      - name: Verify the search index
        run: node scripts/repair-calculator-search-index.cjs --check
      - name: Commit repaired search index
        env:
          BRANCH: fix/50-locale-regression-and-search-index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/calculator-search-index.json
          git commit -m "Add missing canonical calculator search entries"
          git push origin "HEAD:refs/heads/$BRANCH"
