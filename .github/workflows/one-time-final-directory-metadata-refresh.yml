name: One-time final directory metadata count refresh
on:
  push:
    branches:
      - seo/fix-directory-social-metadata-v2-20261125
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate directory
        run: node scripts/build-site-directory.cjs
      - name: Validate exact count and directory metadata
        run: |
          node scripts/build-site-directory.cjs --check
          node -e "const fs=require('fs');const h=fs.readFileSync('calculator/site-directory.html','utf8');for(const x of ['og:type','og:site_name','og:title','og:description','og:url','og:image','twitter:card','twitter:title','twitter:description','twitter:image','/calculator/physics-calculators.html','Search calculators by topic'])if(!h.includes(x))throw new Error('Missing '+x);if(h.includes('&#39; + total + &#39;'))throw new Error('Unexpanded count placeholder');console.log('Directory metadata and topic link verified.')"
      - name: Remove workflow and commit generated page
        run: |
          rm .github/workflows/one-time-final-directory-metadata-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-site-directory.cjs calculator/site-directory.html .github/workflows/one-time-final-directory-metadata-refresh.yml
          git commit -m "seo: render actual catalogue count in directory social metadata [skip ci]"
          git push
