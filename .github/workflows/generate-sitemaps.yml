name: Generate XML sitemaps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/generate-sitemaps.cjs
      - run: node scripts/generate-sitemaps.cjs --check

  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate sitemap index and child sitemaps
        run: node scripts/generate-sitemaps.cjs
      - name: Commit generated sitemap files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-*.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(seo): regenerate XML sitemaps [skip ci]"
            git push
          else
            echo "Sitemaps are already up to date."
          fi
