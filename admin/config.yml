backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "events"
    label: "Events & Meetups"
    folder: "_data/events"
    create: true
    fields:
      - {label: "Event Name", name: "title", widget: "string"}
      - {label: "Event Date", name: "date", widget: "string"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Registration Link", name: "link", widget: "string"}
      - {label: "Event Image", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text"}

