backend:
  name: git-gateway
  branch: main # आपकी मुख्य गिट ब्रांच (जैसे main या master)

media_folder: "assets/uploads" # यहाँ एडमिन पैनल से अपलोड की गई इमेज ऑटोमैटिकली सेव होगी[span_1](start_span)[span_1](end_span)
public_folder: "/assets/uploads"

collections:
  - name: "events"
    label: "Events & Meetups"
    folder: "_data/events" # यहाँ हर इवेंट की फाइल सेव होगी
    create: true
    fields:
      - {label: "Event Name", name: "title", widget: "string"}
      - {label: "Event Date", name: "date", widget: "string"}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Registration Link", name: "link", widget: "string"}
      - {label: "Event Image", name: "image", widget: "image"}
      - {label: "Description", name: "description", widget: "text"}

