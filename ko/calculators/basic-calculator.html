<body><main class="wrap"><nav><a href="/ko/index.html">홈</a> / 기본 계산기</nav><section class="hero"><h1>기본 계산기</h1><p>브라우저에서 기본 산술 연산을 수행하세요.</p></section>
<section class="panel"><h2>기본 계산기</h2><div class="calculator"><output id="display" class="display" aria-live="polite">0</output><div class="keys">
<button class="clear" data-action="clear">C</button><button data-action="delete">지우기</button><button class="op" data-value="/">÷</button><button class="op" data-value="*">×</button>

<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="eq" data-action="equals">=</button>
<button class="zero" data-value="0">0</button><button data-value=".">.</button></div></div><p class="muted">결과는 교육 및 일반 추정 목적이며 세금, 법률 또는 대출 자문이 아닙니다.</p></section>
<section class="panel"><h2>계산 방식</h2><p>브라우저에서 기본 산술 연산을 수행하세요.</p><p><strong>더하기: a + b · 빼기: a − b · 곱하기: a × b · 나누기: a ÷ b</strong></p><ul><li>더하기</li><li>빼기</li><li>곱하기</li><li>나누기</li></ul><p>세율, 공제 및 규정은 국가, 지역 및 거래 유형에 따라 다릅니다. 현지 공식 자료를 확인하세요.</p></section></main>
<script>(()=>{const d=document.getElementById('display');let current='0',stored=null,operator=null,reset=false;function show(){d.textContent=current}function calc(){if(stored===null||!operator)return;const a=stored,b=Number(current);if(operator==='/'&&b===0){current="오류";stored=null;operator=null;reset=true;show();return;}const n=operator==='+'?a+b:operator==='-'?a-b:operator==='*'?a*b:a/b;current=String(Number(n.toPrecision(12)));stored=null;operator=null;reset=true;show()}document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.value,a=b.dataset.action;if(a==='clear'){current='0';stored=null;operator=null;reset=false;show();return;}if(a==='delete'){current=current.length>1?current.slice(0,-1):'0';show();return;}if(a==='equals'){calc();return;}if(v!==undefined){if(['+','-','*','/'].includes(v)){if(stored!==null&&!reset)calc();stored=Number(current);operator=v;reset=true;return;}if(current==="오류"||reset){current=v==='.'?'0.':v;reset=false;}else if(v==='.'&&current.includes('.'))return;else current=current==='0'&&v!=='.'?v:current+v;show();}});})();</script>
