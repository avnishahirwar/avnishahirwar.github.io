<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Resolution Satellite Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        .controls {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }
        .controls h3 {
            margin-bottom: 8px;
            font-size: 16px;
        }
        .controls button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .controls button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="controls">
        <h3>सैटेलाइट मैप (High Clarity)</h3>
        <button onclick="locateUser()">मेरी करंट लोकेशन दिखाएं</button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. डिफॉल्ट मैप इनिशियलाइजेशन (सुरुआत में दिल्ली की लोकेशन)
        const map = L.map('map').setView([28.6139, 77.2090], 18);

        // 2. Esri World Imagery (उच्च स्पष्टता वाली सैटेलाइट इमेजरी)
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            maxZoom: 19
        }).addTo(map);

        // 3. सड़कों और बिल्डिंग्स के नाम/लेबल की ओवरले परत
        const labelsLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        let userMarker;

        // 4. यूजर की करंट लोकेशन ट्रैक करने का फ़ंक्शन
        function locateUser() {
            if (!navigator.geolocation) {
                alert("आपके ब्राउज़र में जियोलोकेशन समर्थित नहीं है।");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // मैप को यूजर की सटीक लोकेशन पर जूम करें (Zoom level 18 clear buildings दिखाता है)
                    map.setView([lat, lng], 18);

                    // यदि मार्कर पहले से मौजूद है, तो उसे अपडेट करें
                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                    } else {
                        userMarker = L.marker([lat, lng]).addTo(map);
                    }

                    userMarker.bindPopup("<b>आप यहाँ हैं!</b>").openPopup();
                },
                (error) => {
                    alert("आपकी लोकेशन प्राप्त करने में असमर्थ। कृपया लोकेशन (GPS) अनुमति चालू करें।");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // पेज लोड होते ही लोकेशन फेच करने का प्रयास करें
        locateUser();
    </script>
</body>
</html>
