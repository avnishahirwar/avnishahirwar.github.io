<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Friendly Calculator Embed</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#172638;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:100%;padding:8px}.frame{width:100%;height:min(760px,82vh);min-height:520px;border:0;border-radius:10px;background:#fff}
.credit{padding:8px 4px;text-align:right;font-size:12px;color:#667587}.credit a{color:#172638;font-weight:700;text-decoration:none}.error{padding:18px;color:#9b2c2c;background:#fff4f4;border:1px solid #f2cccc;border-radius:10px}
</style>
</head>
<body><main class="wrap"><div id="mount"></div><div class="credit">Calculator provided by <a href="https://friendlycalculator.in/" target="_blank" rel="noopener noreferrer">Friendly Calculator</a></div></main>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search);
const src=params.get('src')||'';
const valid=/^\/(?:hi|es|fr|pt|ar|id|bn|ta\/)?calculators\/[a-z0-9-]+\.html$/.test(src);
const mount=document.getElementById('mount');
if(!valid){const e=document.createElement('div');e.className='error';e.textContent='Invalid calculator embed URL. Please copy the embed code from a Friendly Calculator page.';mount.append(e);return;}
const frame=document.createElement('iframe');frame.className='frame';frame.title='Friendly Calculator';frame.loading='lazy';frame.referrerPolicy='strict-origin-when-cross-origin';frame.src=src+(src.includes('?')?'&':'?')+'embed=1';mount.append(frame);
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const h=doc?.querySelector('h1');if(h)frame.title=h.textContent.trim()+' — Friendly Calculator';}catch(_){}});
})();
</script></body></html>
