<section class="panel"><h2>計算する</h2><form data-fc-calc="mortgage" id="fc-mortgage-form"><div class="fields">
<label class="field">物件価格<input id="fc-price" type="number" min="0" step="any" value="300000" required></label>

<label class="field">年間保険料<input id="fc-insurance" type="number" min="0" step="any" value="0"></label>

</div><div class="actions"><button type="submit">計算する</button></div><div class="result" id="fc-mortgage-result" role="status" aria-live="polite">計算結果</div></form></section>
