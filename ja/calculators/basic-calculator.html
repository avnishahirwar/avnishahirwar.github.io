<script>(()=>{const d=document.getElementById('display');let current='0',stored=null,operator=null,reset=false;const fmt=n=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:10}).format(n);function show(){d.textContent=current}function calc(){if(stored===null||!operator)return;const a=stored,b=Number(current);if(operator==='/'&&b===0){current='Error';stored=null;operator=null;reset=true;show();return;}const n=operator==='+'?a+b:operator==='-'?a-b:operator==='*'?a*b:a/b;current=String(Number(n.toPrecision(12)));stored=null;operator=null;reset=true;show()}document.querySelector('.keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.value,a=b.dataset.action;if(a==='clear'){current='0';stored=null;operator=null;reset=false;show();return;}if(a==='delete'){current=current.length>1?current.slice(0,-1):'0';show();return;}if(a==='equals'){calc();return;}if(v!==undefined){if(['+','-','*','/'].includes(v)){if(stored!==null&&!reset)calc();stored=Number(current);operator=v;reset=true;return;}if(current==='Error'||reset){current=v==='.'?'0.':v;reset=false;}else if(v==='.'&&current.includes('.'))return;else current=current==='0'&&v!=='.'?v:current+v;show();}});})();</script>
