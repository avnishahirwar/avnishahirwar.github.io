<meta name="twitter:image" content="https://friendlycalculator.in/og-friendly-calculator.png"></head><body><main class="wrap"><p><a href="/ta/index.html">முகப்பு</a> / கணிப்பான்கள்</p><h1>அடிப்படை கணிப்பான்</h1><p>நான்கு அடிப்படை கணிதச் செயல்களைச் செய்யுங்கள்.</p><section class="panel"><form id="f"><div class="fields"><label>முதல் எண்<input id="a" type="number" step="any" value="12"></label><label>செயல்<select id="op"><option value="add">கூட்டல்</option><option value="sub">கழித்தல்</option><option value="mul">பெருக்கல்</option><option value="div">வகுத்தல்</option></select></label><label>இரண்டாவது எண்<input id="b" type="number" step="any" value="3"></label></div><p><button class="btn">கணக்கிடு</button></p></form><p>முடிவு: <strong class="result" id="out">—</strong></p><p id="status">முடிவுகள் கணிதக் கணக்கீடுகள். உள்ளிட்ட மதிப்புகள் மற்றும் அலகுகளைச் சரிபார்க்கவும்.</p></section><section class="panel"><h2>கணிப்பான்கள்</h2><p>முடிவுகள் கணிதக் கணக்கீடுகள். உள்ளிட்ட மதிப்புகள் மற்றும் அலகுகளைச் சரிபார்க்கவும்.</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("ta-IN",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="தவறான மதிப்பு அல்லது வரையறுக்கப்படாத செயல்."}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("a").value,y=+document.getElementById("b").value,o=document.getElementById("op").value;if(!Number.isFinite(x)||!Number.isFinite(y)||(o==="div"&&y===0)){bad();return;}out=[o==="add"?x+y:o==="sub"?x-y:o==="mul"?x*y:x/y];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="முடிவுகள் கணிதக் கணக்கீடுகள். உள்ளிட்ட மதிப்புகள் மற்றும் அலகுகளைச் சரிபார்க்கவும்.";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
