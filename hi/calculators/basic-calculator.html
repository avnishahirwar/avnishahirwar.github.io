<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>बेसिक कैलकुलेटर | Friendly Calculator</title><meta name="description" content="दो संख्याओं के साथ जोड़, घटाव, गुणा और भाग करें।"><link rel="canonical" href="https://friendlycalculator.in/hi/calculators/basic-calculator.html"><link rel="alternate" hreflang="en" href="https://friendlycalculator.in/calculators/basic-calculator.html"><link rel="alternate" hreflang="hi" href="https://friendlycalculator.in/hi/calculators/basic-calculator.html"><link rel="alternate" hreflang="x-default" href="https://friendlycalculator.in/calculators/basic-calculator.html"><meta name="robots" content="index,follow"><link rel="stylesheet" href="/assets/site-shell.css"></head><body><main class="wrap"><p><a href="/hi/index.html">होम</a> / सभी कैलकुलेटर</p><h1>बेसिक कैलकुलेटर</h1><p>दो संख्याओं के साथ जोड़, घटाव, गुणा और भाग करें।</p><section class="panel"><form id="f"><div class="fields"><label>पहली संख्या<input id="a" type="number" step="any" value="12"></label><label>ऑपरेशन<select id="op"><option value="add">जोड़</option><option value="sub">घटाव</option><option value="mul">गुणा</option><option value="div">भाग</option></select></label><label>दूसरी संख्या<input id="b" type="number" step="any" value="3"></label></div><p><button>गणना करें</button></p></form><p>परिणाम: <strong id="out">—</strong></p><p id="status">परिणाम गणितीय गणनाएँ हैं। उपयोग से पहले इनपुट और इकाइयाँ जाँचें।</p></section><section class="panel"><h2>गणना का तरीका</h2><p>जोड़: a + b। घटाव: a − b। गुणा: a × b। भाग: a ÷ b।</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("hi-IN",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="कृपया सही मान दर्ज करें; शून्य से भाग या अमान्य गणना संभव नहीं है।"}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const a=+document.getElementById("a").value,b=+document.getElementById("b").value,o=document.getElementById("op").value;if(!Number.isFinite(a)||!Number.isFinite(b)||(o==="div"&&b===0)){bad();return;}out=[o==="add"?a+b:o==="sub"?a-b:o==="mul"?a*b:a/b];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="गणना पूरी हुई।";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
