</head><body><main class="wrap"><p><a href="/hi/index.html">होम</a> / सभी कैलकुलेटर</p><h1>बेसिक कैलकुलेटर</h1><p>दो संख्याओं को जोड़ें, घटाएँ, गुणा करें और भाग दें।</p><section class="panel"><form id="f"><div class="fields"><label>पहली संख्या<input id="a" step="any" type="number" value="12"/></label><label>संक्रिया<select id="op"><option value="add">जोड़</option><option value="sub">घटाव</option><option value="mul">गुणा</option><option value="div">भाग</option></select></label><label>दूसरी संख्या<input id="b" step="any" type="number" value="3"/></label></div><p><button>गणना करें</button></p></form><p>परिणाम: <strong id="out">—</strong></p><p id="status">परिणाम गणितीय गणनाएँ हैं। उपयोग करने से पहले इनपुट और इकाइयाँ जाँचें।</p></section><section class="panel"><h2>गणना की विधि</h2><p>जोड़: a + b। घटाव: a − b। गुणा: a × b। भाग: a ÷ b।</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("hi-IN",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="कृपया सही मान दर्ज करें; शून्य से भाग या अमान्य गणना संभव नहीं है।"}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const a=+document.getElementById("a").value,b=+document.getElementById("b").value,o=document.getElementById("op").value;if(!Number.isFinite(a)||!Number.isFinite(b)||(o==="div"&&b===0)){bad();return;}out=[o==="add"?a+b:o==="sub"?a-b:o==="mul"?a*b:a/b];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="गणना पूरी हुई।";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script defer="" src="/assets/site-shell.js"></script></body></html>
