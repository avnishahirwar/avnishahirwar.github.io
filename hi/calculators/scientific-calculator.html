</head><body><main class="wrap"><p><a href="/hi/index.html">होम</a> / सभी कैलकुलेटर</p><h1>साइंटिफिक कैलकुलेटर</h1><p>त्रिकोणमितीय फलन, वर्गमूल, लॉगरिदम और घात की गणना करें।</p><section class="panel"><form id="f"><div class="fields"><label>मान<input id="x" type="number" step="any" value="45"></label><label>फलन<select id="op"><option value="sin">साइन</option><option value="cos">कोसाइन</option><option value="tan">टैंजेंट</option><option value="sqrt">वर्गमूल</option><option value="ln">नेचुरल लॉग</option><option value="log">लॉग बेस 10</option><option value="square">वर्ग</option><option value="cube">घन</option><option value="abs">परम मान</option></select></label><label>कोण<select id="angle"><option value="deg">डिग्री</option><option value="rad">रेडियन</option></select></label></div><p><button>गणना करें</button></p></form><p>परिणाम: <strong id="out">—</strong></p><p id="status">परिणाम गणितीय गणनाएँ हैं। उपयोग से पहले इनपुट और इकाइयाँ जाँचें।</p></section><section class="panel"><h2>गणना का तरीका</h2><p>त्रिकोणमितीय फलन चुने गए डिग्री या रेडियन का उपयोग करते हैं। लॉगरिदम के लिए धनात्मक मान आवश्यक है।</p></section></main><script>(()=>{const f=document.getElementById("f"),s=document.getElementById("status"),fmt=new Intl.NumberFormat("hi-IN",{maximumFractionDigits:8});function bad(){document.getElementById("out").textContent="—";s.textContent="कृपया सही मान दर्ज करें; शून्य से भाग या अमान्य गणना संभव नहीं है।"}f.addEventListener("submit",e=>{e.preventDefault();let out=[];const x=+document.getElementById("x").value,o=document.getElementById("op").value,rad=document.getElementById("angle").value==="deg"?x*Math.PI/180:x;if(!Number.isFinite(x)){bad();return;}let v;if(o==="sin")v=Math.sin(rad);else if(o==="cos")v=Math.cos(rad);else if(o==="tan"){if(Math.abs(Math.cos(rad))<1e-12){bad();return;}v=Math.tan(rad);}else if(o==="sqrt"){if(x<0){bad();return;}v=Math.sqrt(x);}else if(o==="ln"||o==="log"){if(x<=0){bad();return;}v=o==="ln"?Math.log(x):Math.log10(x);}else if(o==="square")v=x*x;else if(o==="cube")v=x*x*x;else v=Math.abs(x);if(!Number.isFinite(v)){bad();return;}out=[v];document.getElementById("out").textContent=fmt.format(out[0]);s.textContent="गणना पूरी हुई।";if(typeof gtag==="function")gtag("event","calculator_used",{calculator_page:location.pathname,calculator_action:"calculate"});});f.requestSubmit();})();</script><script src="/assets/site-shell.js" defer></script></body></html>
